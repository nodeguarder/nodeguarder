name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Agent + MSI
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          cache-on-failure: true

      - name: Build agent (release)
        working-directory: agent
        run: cargo build --release --features "semantic,enterprise,gui"

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $staging = "${{ runner.temp }}\staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "agent\target\release\nodeguarder-agent.exe" $staging
          Copy-Item "agent\target\release\onnxruntime.dll" $staging
          Copy-Item "agent\atr_rules.json" $staging
          echo "STAGING_DIR=$staging" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        working-directory: agent
        run: cargo test --features "test-utils,semantic,enterprise,gui"
        continue-on-error: true

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI installer
        shell: pwsh
        run: |
          .\installer\build_msi.ps1 -SourceDir "$env:STAGING_DIR" -OutputDir "${{ runner.temp }}\msi"
          echo "MSI_PATH=${{ runner.temp }}\msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodeGuarder-Setup
          path: ${{ runner.temp }}\msi\*.msi
          retention-days: 7

      - name: Publish release to public repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          $msiFile = Get-ChildItem "${{ runner.temp }}\msi\*.msi" | Select-Object -First 1
          $tag = "${{ github.ref_name }}"
          $repo = "nodeguarder/releases"
          gh release create $tag --repo $repo --title "NodeGuarder Agent $tag" --notes "See [CHANGES](https://github.com/nodeguarder/nodeguarder)" $msiFile.FullName
