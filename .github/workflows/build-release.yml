name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-msi:
    name: Build Agent + MSI
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          cache-on-failure: true

      - name: Build agent (release)
        working-directory: agent
        run: cargo build --release --features "semantic,enterprise,gui"

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $staging = "${{ runner.temp }}\staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "agent\target\release\nodeguarder-agent.exe" $staging
          Copy-Item "agent\target\release\onnxruntime.dll" $staging
          Copy-Item "agent\atr_rules.json" $staging
          echo "STAGING_DIR=$staging" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        working-directory: agent
        run: cargo test --features "test-utils,semantic,enterprise,gui"
        continue-on-error: true

      - name: Install WiX Toolset & ImageMagick
        shell: pwsh
        run: choco install wixtoolset imagemagick.app -y --no-progress

      - name: Build MSI installer
        shell: pwsh
        run: |
          .\installer\build_msi.ps1 -SourceDir "$env:STAGING_DIR" -OutputDir "${{ runner.temp }}\msi"
          echo "MSI_PATH=${{ runner.temp }}\msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v6
        with:
          name: NodeGuarder-Setup
          path: ${{ runner.temp }}\msi\*.msi
          retention-days: 7

  build-docker:
    name: Build Portal Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build API Docker image
        run: docker build -f agent/Dockerfile.portal -t portal-api agent

      - name: Build UI Docker image
        run: docker build -t portal-ui enterprise-portal/frontend

      - name: Prepare portal bundle
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          docker save portal-api portal-ui -o ng-portal-images-$VERSION.tar
          gzip ng-portal-images-$VERSION.tar
          mkdir -p portal-bundle
          cp enterprise-portal/docker-compose.yml portal-bundle/
          cp enterprise-portal/.env.example portal-bundle/
          cp ng-portal-images-$VERSION.tar.gz portal-bundle/
          cp scripts/bundle-instructions.txt portal-bundle/INSTRUCTIONS.txt
          sed -i "s/{VERSION}/$VERSION/g" portal-bundle/INSTRUCTIONS.txt
          cd portal-bundle && zip -r ../ng-portal-bundle-$VERSION.zip .

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Portal-Bundle
          path: ng-portal-bundle-*.zip
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-msi, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download MSI artifact
        uses: actions/download-artifact@v6
        with:
          name: NodeGuarder-Setup
          path: artifacts

      - name: Download Docker artifact
        uses: actions/download-artifact@v6
        with:
          name: Portal-Bundle
          path: artifacts

      - name: Write release notes
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          sed "s/{VERSION}/$VERSION/g" scripts/release-notes.md > release-notes.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem "artifacts" -Recurse | Where-Object { -not $_.PSIsContainer }
          gh release create $tag --repo nodeguarder/releases --title "NodeGuarder $tag" --notes-file release-notes.md $assets.FullName
