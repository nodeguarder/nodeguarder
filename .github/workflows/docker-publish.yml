name: Publish Portal Docker Images

on:
  push:
    tags:
      - 'portal-v*'

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/nodeguarder/portal-api
  UI_IMAGE: ghcr.io/nodeguarder/portal-ui

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#portal-v}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: agent
          file: agent/Dockerfile.portal
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.API_IMAGE }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI image
        uses: docker/build-push-action@v7
        with:
          context: enterprise-portal/frontend
          file: enterprise-portal/frontend/Dockerfile
          tags: |
            ${{ env.UI_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.UI_IMAGE }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
