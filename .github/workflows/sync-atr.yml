name: Sync ATR Rules
on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:       # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone ATR rules
        run: |
          git config core.protectNTFS false
          git clone --depth 1 https://github.com/Agent-Threat-Rule/agent-threat-rules.git atr-rules/

      - name: Install deps
        run: pip install pyyaml

      - name: Sync rules
        run: python scripts/sync_atr_rules.py --atr-dir $PWD/atr-rules --output $PWD/atr_rules.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet atr_rules.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "atr-bot[bot]"
          git config user.email "atr-bot@users.noreply.github.com"
          git add atr_rules.json
          git commit -m "sync ATR rules ($(date +%Y-%m-%d))" -m "Automated sync from Agent-Threat-Rule/agent-threat-rules"
          git push
