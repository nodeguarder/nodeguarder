[package]
name = "nodeguarder-agent"
version = "1.0.17"
edition = "2021"

[features]
default = ["agent", "semantic", "enterprise", "gui"]
# Enable local agent mode (proxy, detection engine, UI, audit, etc.).
# Omit for headless/portal-only builds.
agent = []
# Enable desktop GUI (system tray, settings window, HITL modals).
# Required for standalone agent mode on Windows. Omit for headless/portal builds.
gui = ["dep:wry", "dep:tao", "dep:tray-icon", "dep:muda", "dep:arboard", "dep:image"]
# Enable semantic ONNX inference via ort (Microsoft ONNX Runtime)
semantic = ["dep:tokenizers", "dep:ort", "dep:ndarray", "dep:once_cell"]
# Enable debug/test utility headers (x-autodecision, x-local-debug).
# NOT for production use — these bypass HITL modals and expose internal state.
test-utils = []
# Enable enterprise portal (REST API + gRPC server + DB)
enterprise = ["dep:tonic", "dep:prost", "dep:sqlx", "dep:tower-http", "dep:jsonwebtoken", "dep:argon2", "dep:bcrypt", "dep:rcgen", "dep:pem", "dep:ring", "dep:thiserror", "dep:anyhow"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
flate2 = "1.0"
tar = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
rand = "0.8"
crossbeam-channel = "0.5"
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
wry = { version = "0.55.0", optional = true }
tao = { version = "0.35.0", optional = true }
tray-icon = { version = "0.22.0", optional = true }
muda = { version = "0.18.0", optional = true }
image = { version = "0.25.10", optional = true }
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
http = "1.4.0"
arboard = { version = "3.6.1", optional = true }
futures-util = "0.3.32"
async-stream = "0.3.6"
rsa = "0.9.10"
pem-rfc7468 = "1.0.0"
x509-cert = "0.2.5"
whoami = "2.1.1"
rustls = { version = "0.23.38", features = ["ring"] }
pdf-extract = "0.10.0"

# Optional: ONNX inference via ort (Microsoft ONNX Runtime, DirectML GPU)
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "directml"], optional = true }
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.20", optional = true }
once_cell = { version = "1.21.4", optional = true }

# Optional: gRPC enterprise portal
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"], optional = true }
prost = { version = "0.13", optional = true }

anyhow = { version = "1", optional = true }

# Optional: Enterprise portal (REST API + DB)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"], optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
jsonwebtoken = { version = "9.3", optional = true }
argon2 = { version = "0.5", optional = true }
bcrypt = { version = "0.16", optional = true }
rcgen = { version = "0.13", features = ["pem", "x509-parser"], optional = true }
pem = { version = "3.0", optional = true }
ring = { version = "0.17", optional = true }
thiserror = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
