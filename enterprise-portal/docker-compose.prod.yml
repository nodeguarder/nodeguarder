services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      POSTGRES_DB: nodeguarder
      POSTGRES_USER: ng_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ng_admin -d nodeguarder"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ng_admin
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: nodeguarder
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    image: portal-api
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - db_password
      - jwt_secret
    environment:
      DATABASE_URL: postgres://ng_admin@pgbouncer:6432/nodeguarder?sslmode=disable
      REST_ADDR: 0.0.0.0:3000
      GRPC_ADDR: 0.0.0.0:50051
      RUST_LOG: ${RUST_LOG:-info}
      ADMIN_GRPC_URL: http://localhost:50051
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORTAL_ENCRYPTION_KEY: ""
    volumes:
      - api_data:/app/data
    networks:
      - internal
    ports:
      - "3000:3000"
      - "50051:50051"
    depends_on:
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  ui:
    image: portal-ui
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 64M

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  pg_data:
  api_data:

networks:
  internal:
    driver: bridge
