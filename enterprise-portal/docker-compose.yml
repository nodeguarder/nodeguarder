version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nodeguarder
      POSTGRES_USER: ng_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ng_admin -d nodeguarder"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ng_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: nodeguarder
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: portal-api
    environment:
      DATABASE_URL: postgres://ng_admin:${DB_PASSWORD}@postgres:5432/nodeguarder
      REST_ADDR: 0.0.0.0:3000
      GRPC_ADDR: 0.0.0.0:50051
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_GRPC_URL: http://localhost:50051
      RUST_LOG: info
    ports:
      - "3000:3000"
      - "50051:50051"
    volumes:
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: portal-ui
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  api_data:
